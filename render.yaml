# Blueprint для Render. Кнопка «Deploy to Render» в README открывает эту
# конфигурацию; Render спросит только BOT_TOKEN и ALLOWED_USER_IDS.
# Адрес приложения (WEBAPP_URL) сервер определит сам по RENDER_EXTERNAL_URL.
services:
  - type: web
    name: veroniks
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DATABASE_PATH
        value: /data/veroniks.db
# Ключ ИИ добавляется позже: Render → сервис → Environment → ANTHROPIC_API_KEY.
#
# Постоянный диск доступен только на платных планах. На бесплатном база
# пересоздаётся из встроенного набора при каждом перезапуске — для каталога
# это нормально: избранное хранится в Telegram/браузере, а не в базе.
# Если перейдёте на план Starter, раскомментируйте:
#    disk:
#      name: veroniks-data
#      mountPath: /data
#      sizeGB: 1
